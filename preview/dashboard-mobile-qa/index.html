<!doctype html><html lang="th"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My Finance · ทดสอบภาพรวมมือถือ</title><style>body{margin:0;background:#edf0f6;font:15px system-ui;color:#202438}header{padding:14px;background:white}select{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccd;margin:6px}main{display:flex;gap:18px;padding:14px;overflow:auto}article{flex:none}h2{font-size:14px}iframe{height:850px;border:1px solid #ccd;border-radius:18px;background:white}</style><header><b>ภาพรวมใหม่ · ข้อมูลสมมติ</b><select aria-label="กรณีทดสอบ" id="scenario"><option value="normal">ใช้งานทั่วไป</option><option value="stress">ชื่อยาว · ยอดหลักล้าน</option><option value="empty">ไม่มีข้อมูล</option></select><label><input type="checkbox" id="dark"> ธีมมืด</label></header><main><article><h2>320 px</h2><iframe title="Phone 320" width="320" src="./normal.html"></iframe></article><article><h2>360 px</h2><iframe title="Phone 360" width="360" src="./normal.html"></iframe></article><article><h2>390 px</h2><iframe title="Phone 390" width="390" src="./normal.html"></iframe></article><article><h2>430 px</h2><iframe title="Phone 430" width="430" src="./normal.html"></iframe></article></main><script>const scenario=document.getElementById("scenario"),dark=document.getElementById("dark");scenario.onchange=()=>document.querySelectorAll("iframe").forEach(f=>f.src="./"+scenario.value+".html");function theme(){document.querySelectorAll("iframe").forEach(f=>{let d=f.contentDocument;d.documentElement.dataset.resolvedTheme=dark.checked?"dark":"light";let l=d.getElementById("darkThemeStylesheet");if(l)l.media=dark.checked?"all":"not all"})}dark.onchange=theme;document.querySelectorAll("iframe").forEach(f=>f.onload=theme);</script></html>
