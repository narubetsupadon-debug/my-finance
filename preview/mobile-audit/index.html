for(const [value,text] of Object.entries(names))page.add(new Option(text,value));
let snapshots;
async function render(){if(!snapshots)return;document.querySelector('main').replaceChildren();document.querySelector('#result').textContent='กำลังตรวจขนาด…';
for(const width of [320,390,430]){const a=document.createElement('article');a.innerHTML='<h2>'+width+' px · '+names[page.value]+'</h2>';const f=document.createElement('iframe');f.title='Phone '+width;f.width=width;f.setAttribute('sandbox','allow-same-origin');a.append(f);document.querySelector('main').append(a);
f.onload=()=>{const d=f.contentDocument;d.documentElement.dataset.resolvedTheme=dark.checked?'dark':'light';d.body.classList.toggle('dark',dark.checked);const sheet=d.querySelector('#darkThemeStylesheet');if(sheet)sheet.media=dark.checked?'all':'not all';setTimeout(()=>{const root=d.documentElement;f.dataset.overflow=String(root.scrollWidth>root.clientWidth);document.querySelector('#result').textContent=Array.from(document.querySelectorAll('iframe')).map(x=>x.width+'px: '+(x.dataset.overflow==='true'?'พบหน้าล้นด้านข้าง':x.dataset.overflow==='false'?'ไม่พบหน้าล้น':'กำลังตรวจ')).join(' · ')},300)};f.srcdoc=snapshots[page.value+'-'+scenario.value]}}
page.onchange=scenario.onchange=dark.onchange=render;
