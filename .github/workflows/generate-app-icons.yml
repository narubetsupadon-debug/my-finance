name: Generate My Finance app icons
on:
  push:
    branches: [main]
    paths:
      - app-icon.svg
      - .github/workflows/generate-app-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG assets from the selected wallet logo
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          for target, size in [
              ('apple-touch-icon.png',180),
              ('favicon-32.png',32),
              ('app-icon-192.png',192),
              ('app-icon-512.png',512),
              ('app-icon-maskable-512.png',512)
          ]:
              cairosvg.svg2png(url='app-icon.svg',write_to=target,output_width=size,output_height=size)
              print('Generated',target,size)
          PY
      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png favicon-32.png app-icon-192.png app-icon-512.png app-icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Update iPhone and PWA PNG icons from wallet logo"
            git push
          fi
